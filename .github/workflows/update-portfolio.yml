name: Update portfolio

on:
  schedule:
    # 18:00 UTC on weekdays — after US market close, after European close too
    - cron: "0 18 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/build_portfolio.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.csv site/data/portfolio.json site/data/history.json
          git diff --cached --quiet || git commit -m "Update portfolio data"
          git push
